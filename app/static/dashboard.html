<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard — Tenura</title>
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#f5f7f8" />
  <link rel="icon" type="image/png" sizes="512x512" href="/favicon.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="stylesheet" href="/styles.css?v=3" />
  <link rel="stylesheet" href="/app.css?v=3" />
</head>
<body data-app="dashboard">
  <div class="app">
    <aside class="sidebar" data-shell="sidebar"></aside>

    <div class="main-col">
      <header class="topbar" data-shell="topbar" data-shell-search="Search your analyses…"></header>

      <main class="page">
        <div class="page-head">
          <div>
            <h1>Dashboard</h1>
            <p class="page-sub">Everything you have analysed, at a glance.</p>
          </div>
          <a class="btn-new" href="/dashboard/new">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
            New analysis
          </a>
        </div>

        <!-- Stat cards -->
        <section class="stat-cards" id="statCards" aria-live="polite">
          <div class="stat-card is-brand">
            <span class="sc-ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg></span>
            <div><div class="sc-label">Total analyses</div><div class="sc-value" id="statTotal">—</div></div>
          </div>
          <div class="stat-card is-danger">
            <span class="sc-ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l9 16H3z"/><path d="M12 9v5M12 17h.01"/></svg></span>
            <div><div class="sc-label">High risk</div><div class="sc-value" id="statHigh">—</div></div>
          </div>
          <div class="stat-card is-warn">
            <span class="sc-ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/></svg></span>
            <div><div class="sc-label">Review needed</div><div class="sc-value" id="statReview">—</div></div>
          </div>
          <div class="stat-card">
            <span class="sc-ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg></span>
            <div><div class="sc-label">Added this month</div><div class="sc-value" id="statMonth">—</div></div>
          </div>
        </section>

        <!-- Charts -->
        <section class="chart-grid">
          <div class="panel chart-card">
            <div class="chart-head">
              <svg class="ch-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
              <h2>Analyses by risk</h2>
            </div>
            <div class="chart-body" id="riskChart"></div>
            <div class="chart-legend" id="riskLegend"></div>
          </div>

          <div class="panel chart-card">
            <div class="chart-head">
              <svg class="ch-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l5-5 4 3 6-8"/><path d="M3 21h18"/></svg>
              <h2>Risk score over time</h2>
            </div>
            <div class="chart-body" id="trendChart"></div>
          </div>
        </section>

        <!-- Analyses table -->
        <section class="panel table-card">
          <div class="table-toolbar">
            <span class="tt-title">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>
              My analyses
            </span>
            <span class="tt-spacer"></span>
            <label class="tt-search" for="tableSearch">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M16.5 16.5 20.5 20.5"/></svg>
              <input type="search" id="tableSearch" placeholder="Search…" aria-label="Search analyses" autocomplete="off" />
            </label>
            <div class="filter-wrap">
              <button class="tt-btn" id="filterBtn" type="button" aria-expanded="false">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5h18l-7 8v6l-4-2v-4z"/></svg>
                Filter
              </button>
              <div class="filter-menu" id="filterMenu" role="menu" hidden>
                <button class="filter-opt is-active" data-band="all" role="menuitemradio" aria-checked="true" type="button">All analyses</button>
                <button class="filter-opt" data-band="high" role="menuitemradio" aria-checked="false" type="button">High risk</button>
                <button class="filter-opt" data-band="moderate" role="menuitemradio" aria-checked="false" type="button">Moderate risk</button>
                <button class="filter-opt" data-band="low" role="menuitemradio" aria-checked="false" type="button">Low risk</button>
                <button class="filter-opt" data-band="unknown" role="menuitemradio" aria-checked="false" type="button">Review needed</button>
              </div>
            </div>
            <button class="tt-btn" id="exportBtn" type="button">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M5 21h14"/></svg>
              Export
            </button>
          </div>

          <div class="table-scroll">
            <table class="data-table">
              <thead>
                <tr>
                  <th class="col-check"><input type="checkbox" id="checkAll" aria-label="Select all" /></th>
                  <th>Agreement</th>
                  <th>Risk</th>
                  <th>Score</th>
                  <th>Flagged</th>
                  <th>Missing</th>
                  <th>Jurisdiction</th>
                  <th>Analysed</th>
                  <th>Coverage</th>
                </tr>
              </thead>
              <tbody id="tableBody"></tbody>
            </table>
          </div>

          <div class="pager" id="pager"></div>
        </section>
      </main>
    </div>
  </div>

  <script src="/common.js?v=3"></script>
  <script src="/dashboard.js?v=3"></script>
</body>
</html>
