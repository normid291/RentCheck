name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tenura
          POSTGRES_PASSWORD: tenura
          POSTGRES_DB: tenura_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tenura"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://tenura:tenura@localhost:5432/tenura_test
      SESSION_SECRET: ci-only-session-secret-that-is-deliberately-long-enough
      EMAIL_PROVIDER: console
      APP_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check app tests/unit tests/integration tests/conftest.py

      - name: Type-check (mypy, the modules we have annotated)
        run: |
          mypy \
            app/config.py \
            app/logging_config.py \
            app/migrations.py \
            app/seed_clause_reference.py \
            app/routers/agreements.py \
            app/services/scoring.py \
            app/services/jurisdiction.py \
            app/services/clause_matcher.py \
            app/services/red_flags.py \
            app/services/redirects.py \
            app/services/document_classifier.py \
            app/services/ai_inference.py

      - name: Prepare database schema + seed norms
        run: python -m app.init_db

      - name: Tests
        run: pytest
